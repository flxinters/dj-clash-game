<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DJ TRANSITION CLASH - PRO CONSOLE</title>
  <!-- Tone.js for Audio Routing & EQ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Wavesurfer.js for Visual Rendering -->
  <script src="https://unpkg.com/wavesurfer.js@7"></script>

  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #121216;
      --panel-bg: #18181f;
      --cyan: #00f2fe;
      --text-main: #ffffff;
      --text-muted: #70707c;
      --border: #262630;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: var(--cyan);
      letter-spacing: 2px;
      font-size: 1.8rem;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    p.subtitle {
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 0.85rem;
    }

    .dj-console {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 880px;
      max-width: 95vw;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .decks {
      display: flex;
      gap: 20px;
      width: 100%;
    }

    .deck {
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 16px;
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }

    .deck-title {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .bpm-badge {
      background: #000;
      color: var(--cyan);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: monospace;
      border: 1px solid var(--border);
    }

    .waveform-card {
      width: 100%;
      height: 100px;
      background: #050507;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden !important;
    }

    .waveform-target {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .beatgrid-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    .playhead-center {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 8px var(--cyan);
      z-index: 100;
      pointer-events: none;
    }

    .track-info-badge {
      background: #121216;
      border: 1px solid var(--border);
      color: var(--cyan);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
      margin-bottom: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transport-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 15px;
    }

    .cue-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0d0d11;
      border: 2px solid #ff007f;
      color: #ff007f;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0d0d11;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mixer-strip {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #0d0d11;
      padding: 15px 5px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .v-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .v-control label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      font-weight: 600;
    }

    input[type=range].vertical {
      writing-mode: bt-linear;
      appearance: slider-vertical;
      width: 8px;
      height: 90px;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .crossfader-panel {
      margin-top: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }

    .crossfader-slider {
      width: 70%;
      height: 6px;
      accent-color: var(--cyan);
      margin-top: 10px;
      cursor: pointer;
    }

    .fader-labels {
      display: flex;
      justify-content: space-between;
      padding: 0 15%;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .actions { margin-top: 20px; text-align: center; }

    .btn-submit {
      background: var(--cyan);
      color: #000;
      border: none;
      padding: 12px 32px;
      font-weight: 700;
      border-radius: 20px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .score-box {
      margin-top: 20px;
      background: #0d0d11;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      display: none;
    }

    .score-header { font-size: 1.2rem; color: var(--cyan); font-weight: bold; }
    .score-log { color: var(--text-muted); font-size: 0.8rem; margin-top: 8px; }
  </style>
</head>
<body>

  <h1>DJ TRANSITION CLASH</h1>
  <p class="subtitle">QUANTIZED TRANSIENT DETECTION ENGINE</p>

  <div class="dj-console">
    <div class="decks">
      
      <!-- DECK A -->
      <div class="deck">
        <div class="deck-header">
          <span class="deck-title">DECK A</span>
          <span id="bpmA" class="bpm-badge">Analyzing...</span>
        </div>
        <div class="waveform-card">
          <div class="playhead-center"></div>
          <div id="waveA" class="waveform-target"></div>
          <canvas id="gridA" class="beatgrid-canvas"></canvas>
        </div>
        
        <div class="track-info-badge">TEST TRACK A (01 Blessings.mp3)</div>
        
        <div class="transport-bar">
          <button id="cueA" class="cue-btn">CUE</button>
          <button id="playA" class="play-btn">&#9654;</button>
        </div>

        <div class="mixer-strip">
          <div class="v-control">
            <label>VOL [Q/W]</label>
            <input type="range" id="volA" class="vertical" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="v-control"><label>TRIM</label><input type="range" id="trimA" class="vertical" min="-12" max="12" step="0.5" value="0"></div>
          <div class="v-control"><label>HIGH</label><input type="range" id="highA" class="vertical" min="-24" max="6" step="1" value="0"></div>
          <div class="v-control"><label>MID</label><input type="range" id="midA" class="vertical" min="-24" max="6" step="1" value="0"></div>
          <div class="v-control"><label>LOW</label><input type="range" id="lowA" class="vertical" min="-24" max="6" step="1" value="0"></div>
        </div>
      </div>

      <!-- DECK B -->
      <div class="deck">
        <div class="deck-header">
          <span class="deck-title">DECK B</span>
          <span id="bpmB" class="bpm-badge">Analyzing...</span>
        </div>
        <div class="waveform-card">
          <div class="playhead-center"></div>
          <div id="waveB" class="waveform-target"></div>
          <canvas id="gridB" class="beatgrid-canvas"></canvas>
        </div>

        <div class="track-info-badge">TEST TRACK B (Omar + & Luke Dean - Make Believe.mp3)</div>

        <div class="transport-bar">
          <button id="cueB" class="cue-btn">CUE</button>
          <button id="playB" class="play-btn">&#9654;</button>
        </div>

        <div class="mixer-strip">
          <div class="v-control">
            <label>VOL [O/P]</label>
            <input type="range" id="volB" class="vertical" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="v-control"><label>TRIM</label><input type="range" id="trimB" class="vertical" min="-12" max="12" step="0.5" value="3.5"></div>
          <div class="v-control"><label>HIGH</label><input type="range" id="highB" class="vertical" min="-24" max="6" step="1" value="0"></div>
          <div class="v-control"><label>MID</label><input type="range" id="midB" class="vertical" min="-24" max="6" step="1" value="0"></div>
          <div class="v-control"><label>LOW</label><input type="range" id="lowB" class="vertical" min="-24" max="6" step="1" value="0"></div>
        </div>
      </div>

    </div>

    <!-- CROSSFADER -->
    <div class="crossfader-panel">
      <label>CROSSFADER</label><br>
      <input type="range" id="fader" class="crossfader-slider" min="0" max="1" step="0.01" value="0">
      <div class="fader-labels"><span>DECK A</span><span>MIX</span><span>DECK B</span></div>
    </div>

    <div class="actions">
      <button id="submitBtn" class="btn-submit">EVALUATE TRANSITION</button>
    </div>

    <div id="scoreBox" class="score-box">
      <div id="scoreHeader" class="score-header">SCORE: 0 / 100</div>
      <div id="scoreLog" class="score-log"></div>
    </div>
  </div>

  <script>
    const TEST_TRACK_A = "01 Blessings.mp3";
    const TEST_TRACK_B = "Omar + & Luke Dean - Make Believe.mp3";

    let wsA, wsB;
    let eqA, eqB, volA, volB, trimNodeA, trimNodeB, crossFade;
    let transitionStart = 0, transitionEnd = 0;

    let detectedBpmA = 128, detectedBpmB = 128;
    let autoOffsetA = 0, autoOffsetB = 0;

    function setupToneNodes() {
      crossFade = new Tone.CrossFade(0).toDestination();

      eqA = new Tone.EQ3(0, 0, 0);
      trimNodeA = new Tone.Volume(0);
      volA = new Tone.Volume(0);
      eqA.chain(trimNodeA, volA, crossFade.a);

      eqB = new Tone.EQ3(0, 0, 0);
      trimNodeB = new Tone.Volume(3.5);
      volB = new Tone.Volume(0);
      eqB.chain(trimNodeB, volB, crossFade.b);
    }

    // DSP Onset Analysis: Detects First Heavy Sub-Bass Transient (Kick Drum)
    async function quantizeAudioTrack(url) {
      try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const buffer = await audioCtx.decodeAudioData(arrayBuffer);

        const offlineCtx = new OfflineAudioContext(1, buffer.length, buffer.sampleRate);
        const source = offlineCtx.createBufferSource();
        source.buffer = buffer;

        // Low-pass filter to isolate the sub-bass kick drum (transient)
        const filter = offlineCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 140;

        source.connect(filter);
        filter.connect(offlineCtx.destination);
        source.start(0);

        const renderedBuffer = await offlineCtx.startRendering();
        const data = renderedBuffer.getChannelData(0);

        // Find the precise timestamp of the FIRST heavy kick transient
        let firstKickTime = 0;
        const threshold = 0.25;
        for (let i = 0; i < data.length; i++) {
          if (Math.abs(data[i]) > threshold) {
            firstKickTime = i / buffer.sampleRate;
            break;
          }
        }

        // Tempo Estimation
        let peaks = [];
        for (let i = 0; i < Math.min(data.length, buffer.sampleRate * 20); i += 200) {
          if (Math.abs(data[i]) > threshold) {
            peaks.push(i / buffer.sampleRate);
          }
        }

        let intervals = [];
        for (let i = 1; i < peaks.length; i++) {
          let diff = peaks[i] - peaks[i - 1];
          if (diff > 0.35 && diff < 0.8) intervals.push(diff);
        }

        let bpm = 128;
        if (intervals.length > 0) {
          const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
          bpm = Math.round(60 / avgInterval);
          while (bpm < 118) bpm *= 2;
          while (bpm > 150) bpm /= 2;
        }

        return { bpm, firstKickTime };
      } catch (err) {
        return { bpm: 128, firstKickTime: 0 };
      }
    }

    // Rekordbox Quantized Beatgrid Canvas Overlay
    function drawBeatgrid(canvasId, wsInstance, bpm, firstBeatOffset) {
      const canvas = document.getElementById(canvasId);
      if (!canvas || !wsInstance) return;
      const ctx = canvas.getContext('2d');

      if (canvas.width !== canvas.offsetWidth) canvas.width = canvas.offsetWidth;
      if (canvas.height !== canvas.offsetHeight) canvas.height = canvas.offsetHeight;

      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);

      const currentTime = wsInstance.getCurrentTime();
      const minPxPerSec = 80;
      const secPerBeat = 60 / bpm;

      const windowDuration = width / minPxPerSec;
      const startTime = currentTime - (windowDuration / 2);
      const endTime = currentTime + (windowDuration / 2);

      const startBeat = Math.floor((startTime - firstBeatOffset) / secPerBeat);
      const endBeat = Math.ceil((endTime - firstBeatOffset) / secPerBeat);

      for (let b = startBeat; b <= endBeat; b++) {
        const beatTime = firstBeatOffset + (b * secPerBeat);
        const x = (beatTime - startTime) * minPxPerSec;

        if (x >= 0 && x <= width) {
          const isDownbeat = (b % 4 === 0);
          ctx.fillStyle = isDownbeat ? "rgba(0, 242, 254, 0.9)" : "rgba(255, 255, 255, 0.25)";
          ctx.fillRect(x, 0, isDownbeat ? 2 : 1, height);

          if (isDownbeat && b >= 0) {
            ctx.font = "9px monospace";
            ctx.fillStyle = "rgba(0, 242, 254, 0.9)";
            ctx.fillText(Math.floor(b / 4) + 1, x + 3, 12);
          }
        }
      }
    }

    function renderLoop() {
      if (wsA) drawBeatgrid('gridA', wsA, detectedBpmA, autoOffsetA);
      if (wsB) drawBeatgrid('gridB', wsB, detectedBpmB, autoOffsetB);
      requestAnimationFrame(renderLoop);
    }

    async function initDecks() {
      setupToneNodes();

      const config = {
        waveColor: '#1e1e28',
        progressColor: '#00f2fe',
        cursorColor: 'transparent',
        barWidth: 3,
        barGap: 2,
        barRadius: 2,
        height: 100,
        minPxPerSec: 80,
        autoScroll: true,
        autoCenter: true,
        hideScrollbar: true,
        normalize: true
      };

      wsA = WaveSurfer.create({ ...config, container: '#waveA', url: TEST_TRACK_A });
      wsA.on('ready', () => {
        const mediaNode = Tone.getContext().rawContext.createMediaElementSource(wsA.getMediaElement());
        Tone.connect(mediaNode, eqA);
      });

      wsB = WaveSurfer.create({ ...config, container: '#waveB', url: TEST_TRACK_B });
      wsB.on('ready', () => {
        const mediaNode = Tone.getContext().rawContext.createMediaElementSource(wsB.getMediaElement());
        Tone.connect(mediaNode, eqB);
      });

      // Run Quantization Analysis
      const resA = await quantizeAudioTrack(TEST_TRACK_A);
      detectedBpmA = resA.bpm;
      autoOffsetA = resA.firstKickTime;
      document.getElementById('bpmA').innerText = `${detectedBpmA} BPM`;

      const resB = await quantizeAudioTrack(TEST_TRACK_B);
      detectedBpmB = resB.bpm;
      autoOffsetB = resB.firstKickTime;
      document.getElementById('bpmB').innerText = `${detectedBpmB} BPM`;

      requestAnimationFrame(renderLoop);
    }

    window.addEventListener('DOMContentLoaded', initDecks);

    // Transport Controls
    document.getElementById('cueA').addEventListener('click', () => { wsA.pause(); wsA.setTime(autoOffsetA); document.getElementById('playA').innerHTML = "&#9654;"; });
    document.getElementById('cueB').addEventListener('click', () => { wsB.pause(); wsB.setTime(autoOffsetB); document.getElementById('playB').innerHTML = "&#9654;"; });

    document.getElementById('playA').addEventListener('click', async () => {
      await Tone.start();
      if (wsA.isPlaying()) { wsA.pause(); document.getElementById('playA').innerHTML = "&#9654;"; }
      else { wsA.play(); document.getElementById('playA').innerHTML = "&#10074;&#10074;"; }
    });

    document.getElementById('playB').addEventListener('click', async () => {
      await Tone.start();
      if (wsB.isPlaying()) { wsB.pause(); document.getElementById('playB').innerHTML = "&#9654;"; }
      else { wsB.play(); document.getElementById('playB').innerHTML = "&#10074;&#10074;"; }
    });

    // Mixer Listeners
    document.getElementById('volA').addEventListener('input', (e) => { if (volA) volA.volume.value = Tone.gainToDb(parseFloat(e.target.value)); });
    document.getElementById('volB').addEventListener('input', (e) => { if (volB) volB.volume.value = Tone.gainToDb(parseFloat(e.target.value)); });

    document.getElementById('trimA').addEventListener('input', (e) => { if (trimNodeA) trimNodeA.volume.value = parseFloat(e.target.value); });
    document.getElementById('trimB').addEventListener('input', (e) => { if (trimNodeB) trimNodeB.volume.value = parseFloat(e.target.value); });

    document.getElementById('highA').addEventListener('input', (e) => { if (eqA) eqA.high.value = parseFloat(e.target.value); });
    document.getElementById('midA').addEventListener('input', (e) => { if (eqA) eqA.mid.value = parseFloat(e.target.value); });
    document.getElementById('lowA').addEventListener('input', (e) => { if (eqA) eqA.low.value = parseFloat(e.target.value); });

    document.getElementById('highB').addEventListener('input', (e) => { if (eqB) eqB.high.value = parseFloat(e.target.value); });
    document.getElementById('midB').addEventListener('input', (e) => { if (eqB) eqB.mid.value = parseFloat(e.target.value); });
    document.getElementById('lowB').addEventListener('input', (e) => { if (eqB) eqB.low.value = parseFloat(e.target.value); });

    // Hotkeys
    window.addEventListener('keydown', (e) => {
      const volSliderA = document.getElementById('volA');
      const volSliderB = document.getElementById('volB');
      if (e.key.toLowerCase() === 'q') { volSliderA.value = Math.max(0, parseFloat(volSliderA.value) - 0.05); volSliderA.dispatchEvent(new Event('input')); }
      if (e.key.toLowerCase() === 'w') { volSliderA.value = Math.min(1, parseFloat(volSliderA.value) + 0.05); volSliderA.dispatchEvent(new Event('input')); }
      if (e.key.toLowerCase() === 'o') { volSliderB.value = Math.max(0, parseFloat(volSliderB.value) - 0.05); volSliderB.dispatchEvent(new Event('input')); }
      if (e.key.toLowerCase() === 'p') { volSliderB.value = Math.min(1, parseFloat(volSliderB.value) + 0.05); volSliderB.dispatchEvent(new Event('input')); }
    });

    // Crossfader Logic
    const fader = document.getElementById('fader');
    fader.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (crossFade) crossFade.fade.value = val;
      if (val > 0.05 && transitionStart === 0) transitionStart = Date.now();
      if (val >= 0.95 && transitionStart !== 0 && transitionEnd === 0) transitionEnd = Date.now();
    });

    // AI Evaluator
    document.getElementById('submitBtn').addEventListener('click', () => {
      let score = 100;
      let logs = [];
      const faderVal = parseFloat(fader.value);
      const lowAVal = eqA ? eqA.low.value : 0;
      const lowBVal = eqB ? eqB.low.value : 0;

      if (faderVal < 0.9) { score -= 35; logs.push("❌ Incomplete transition: Crossfader never reached Deck B (-35 pts)"); }
      else { logs.push("✅ Full crossfader sweep completed."); }

      if (transitionStart && transitionEnd) {
        const duration = (transitionEnd - transitionStart) / 1000;
        logs.push(`⏱️ Duration: ${duration.toFixed(2)}s`);
        if (duration < 2.0) { score -= 25; logs.push("⚠️ Transition too fast/abrupt (-25 pts)"); }
        else if (duration > 9.0) { score -= 15; logs.push("⚠️ Transition too slow (-15 pts)"); }
        else { logs.push("⭐ Optimal transition pacing."); }
      } else { score -= 40; logs.push("❌ Crossfader movement missing (-40 pts)"); }

      if (lowAVal > -6 && lowBVal > -6 && faderVal > 0.3 && faderVal < 0.7) {
        score -= 20; logs.push("⚠️ Low-end clash detected! Both sub-bass EQ knobs were open during the blend (-20 pts)");
      } else { logs.push("⭐ Clean EQ separation (no low-end clash)."); }

      score = Math.max(0, score);
      document.getElementById('scoreBox').style.display = "block";
      document.getElementById('scoreHeader').innerText = `SCORE: ${score} / 100`;
      document.getElementById('scoreLog').innerHTML = logs.map(l => `<p style="margin: 3px 0;">${l}</p>`).join('');
    });
  </script>
</body>
</html>
