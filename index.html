<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DJ TRANSITION CLASH - PRO CONSOLE</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #121216;
      --panel-bg: #18181f;
      --cyan: #00f2fe;
      --text-main: #ffffff;
      --text-muted: #70707c;
      --border: #262630;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: var(--cyan);
      letter-spacing: 2px;
      font-size: 1.8rem;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    p.subtitle {
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 0.85rem;
    }

    .dj-console {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 880px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .decks {
      display: flex;
      gap: 20px;
    }

    .deck {
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 16px;
      flex: 1;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }

    .deck-title {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .bpm-badge {
      background: #000;
      color: var(--cyan);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: monospace;
      border: 1px solid var(--border);
    }

    /* Expanded Waveform Screen */
    .waveform-card {
      width: 100%;
      height: 100px;
      background: #050507;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .playhead {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background-color: var(--text-main);
      box-shadow: 0 0 8px var(--cyan);
      z-index: 10;
    }

    .file-btn-wrapper {
      position: relative;
      margin-bottom: 15px;
      width: 100%;
    }

    .custom-file-btn {
      background: #121216;
      border: 1px dashed var(--cyan);
      color: var(--cyan);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: block;
      transition: all 0.2s ease;
    }

    .custom-file-btn:hover {
      background: rgba(0, 242, 254, 0.1);
    }

    .hidden-file-input {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* Transport Controls Section */
    .transport-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 15px;
    }

    .cue-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0d0d11;
      border: 2px solid #ff007f;
      color: #ff007f;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .cue-btn:hover {
      background: #ff007f;
      color: #000;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
    }

    .play-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0d0d11;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0,242,254,0.1);
    }

    .play-btn:hover {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 15px rgba(0,242,254,0.4);
    }

    .transport-bar button:disabled {
      border-color: var(--border) !important;
      color: var(--text-muted) !important;
      box-shadow: none !important;
      cursor: not-allowed;
    }

    .mixer-strip {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #0d0d11;
      padding: 15px 5px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .v-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .v-control label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      font-weight: 600;
    }

    input[type=range].vertical {
      writing-mode: bt-linear;
      appearance: slider-vertical;
      width: 8px;
      height: 90px;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .crossfader-panel {
      margin-top: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }

    .crossfader-panel label {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .crossfader-slider {
      width: 70%;
      height: 6px;
      accent-color: var(--cyan);
      margin-top: 10px;
      cursor: pointer;
    }

    .fader-labels {
      display: flex;
      justify-content: space-between;
      padding: 0 15%;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .actions {
      margin-top: 20px;
      text-align: center;
    }

    .btn-submit {
      background: var(--cyan);
      color: #000;
      border: none;
      padding: 12px 32px;
      font-weight: 700;
      border-radius: 20px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit:hover { opacity: 0.85; }

    .score-box {
      margin-top: 20px;
      background: #0d0d11;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      display: none;
    }

    .score-header {
      font-size: 1.2rem;
      color: var(--cyan);
      font-weight: bold;
    }

    .score-log {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--cyan);
      border-radius: 10px;
      padding: 20px;
      width: 420px;
      text-align: center;
    }

    .cue-slider {
      width: 100%;
      accent-color: var(--cyan);
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <h1>DJ TRANSITION CLASH</h1>
  <p class="subtitle">PRO CONSOLE • HOTKEYS: DECK A VOL [Q/W] | DECK B VOL [O/P]</p>

  <div class="dj-console">
    <div class="decks">
      
      <!-- DECK A -->
      <div class="deck">
        <div class="deck-header">
          <span class="deck-title">DECK A</span>
          <span id="bpmA" class="bpm-badge">-- BPM</span>
        </div>
        <div class="waveform-card">
          <div class="playhead"></div>
          <canvas id="waveA"></canvas>
        </div>
        
        <div class="file-btn-wrapper">
          <div id="fileBtnA" class="custom-file-btn">LOAD TRACK A</div>
          <input type="file" id="fileA" class="hidden-file-input" accept="audio/*">
        </div>
        
        <div class="transport-bar">
          <button id="cueA" class="cue-btn" disabled>CUE</button>
          <button id="playA" class="play-btn" disabled>&#9654;</button>
        </div>

        <div class="mixer-strip">
          <div class="v-control">
            <label>VOL [Q/W]</label>
            <input type="range" id="volA" class="vertical" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="v-control">
            <label>HIGH</label>
            <input type="range" id="highA" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
          <div class="v-control">
            <label>MID</label>
            <input type="range" id="midA" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
          <div class="v-control">
            <label>LOW</label>
            <input type="range" id="lowA" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
        </div>
      </div>

      <!-- DECK B -->
      <div class="deck">
        <div class="deck-header">
          <span class="deck-title">DECK B</span>
          <span id="bpmB" class="bpm-badge">-- BPM</span>
        </div>
        <div class="waveform-card">
          <div class="playhead"></div>
          <canvas id="waveB"></canvas>
        </div>

        <div class="file-btn-wrapper">
          <div id="fileBtnB" class="custom-file-btn">LOAD TRACK B</div>
          <input type="file" id="fileB" class="hidden-file-input" accept="audio/*">
        </div>

        <div class="transport-bar">
          <button id="cueB" class="cue-btn" disabled>CUE</button>
          <button id="playB" class="play-btn" disabled>&#9654;</button>
        </div>

        <div class="mixer-strip">
          <div class="v-control">
            <label>VOL [O/P]</label>
            <input type="range" id="volB" class="vertical" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="v-control">
            <label>HIGH</label>
            <input type="range" id="highB" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
          <div class="v-control">
            <label>MID</label>
            <input type="range" id="midB" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
          <div class="v-control">
            <label>LOW</label>
            <input type="range" id="lowB" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
        </div>
      </div>

    </div>

    <!-- CROSSFADER -->
    <div class="crossfader-panel">
      <label>CROSSFADER</label><br>
      <input type="range" id="fader" class="crossfader-slider" min="0" max="1" step="0.01" value="0">
      <div class="fader-labels">
        <span>DECK A</span>
        <span>MIX</span>
        <span>DECK B</span>
      </div>
    </div>

    <div class="actions">
      <button id="submitBtn" class="btn-submit">EVALUATE TRANSITION</button>
    </div>

    <div id="scoreBox" class="score-box">
      <div id="scoreHeader" class="score-header">SCORE: 0 / 100</div>
      <div id="scoreLog" class="score-log"></div>
    </div>
  </div>

  <!-- START TIMESTAMP SELECTOR MODAL -->
  <div id="cueModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-top:0; color: var(--cyan);">SELECT START CUE POINT</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted);">Scrub to choose where the track should start playing:</p>
      <input type="range" id="cueScrubber" class="cue-slider" min="0" max="100" value="0">
      <div id="cueTimeDisplay" style="font-family: monospace; color: var(--cyan); margin-bottom: 15px;">00:00</div>
      <button id="confirmCueBtn" class="btn-submit">CONFIRM START POINT</button>
    </div>
  </div>

  <script>
    let playerA, playerB, eqA, eqB, volA, volB, crossFade;
    let transitionStart = 0, transitionEnd = 0;
    let pendingFile = null, pendingIsDeckA = false;
    let startCueA = 0, startCueB = 0;
    let pausePositionA = 0, pausePositionB = 0;
    let playStartTimeA = 0, playStartTimeB = 0;
    let estimatedBpmA = 128, estimatedBpmB = 128;

    function getCrossFade() {
      if (!crossFade) crossFade = new Tone.CrossFade(0).toDestination();
      return crossFade;
    }

    // Smoothed Waveform Engine with Rekordbox Beatgrid Lines
    function renderMovingWaveform(canvasId, player, cueOffset, playStartTime, pausePos, bpm) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      if (canvas.width !== canvas.offsetWidth) canvas.width = canvas.offsetWidth || 380;
      if (canvas.height !== canvas.offsetHeight) canvas.height = canvas.offsetHeight || 100;

      const width = canvas.width;
      const height = canvas.height;
      const amp = height / 2;

      ctx.clearRect(0, 0, width, height);

      if (!player || !player.buffer || !player.buffer.loaded) return;

      const buffer = player.buffer;
      const rawData = buffer.getChannelData(0);
      const sampleRate = buffer.sampleRate;

      // Determine active playback position
      let currentTime = pausePos > 0 ? pausePos : cueOffset;
      if (player.state === "started" && playStartTime > 0) {
        const elapsed = (performance.now() - playStartTime) / 1000;
        currentTime = (pausePos > 0 ? pausePos : cueOffset) + elapsed;
      }

      const windowDuration = 3.0; // 3-second visible window
      const centerSample = Math.floor(currentTime * sampleRate);
      const halfWindowSamples = Math.floor((windowDuration / 2) * sampleRate);
      const startSample = centerSample - halfWindowSamples;
      const totalWindowSamples = halfWindowSamples * 2;

      // 1. Draw Beatgrid Lines
      const secondsPerBeat = 60 / bpm;
      const windowStartTime = currentTime - (windowDuration / 2);
      const windowEndTime = currentTime + (windowDuration / 2);

      const firstBeatIndex = Math.ceil(windowStartTime / secondsPerBeat);
      const lastBeatIndex = Math.floor(windowEndTime / secondsPerBeat);

      ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
      for (let b = firstBeatIndex; b <= lastBeatIndex; b++) {
        const beatTime = b * secondsPerBeat;
        const beatX = ((beatTime - windowStartTime) / windowDuration) * width;
        ctx.fillRect(beatX, 0, 1.5, height);
      }

      // 2. Draw Smoothed Discrete Waveform Bars
      const numBars = 75; // Discrete rounded bars across the screen
      const barWidth = width / numBars;
      const samplesPerBar = Math.floor(totalWindowSamples / numBars);

      ctx.fillStyle = "#00f2fe";

      for (let i = 0; i < numBars; i++) {
        const barStartSample = Math.floor(startSample + (i * samplesPerBar));
        
        if (barStartSample >= 0 && barStartSample < rawData.length) {
          let sum = 0;
          let count = 0;
          
          for (let s = 0; s < samplesPerBar; s += 4) {
            if (barStartSample + s < rawData.length) {
              sum += Math.abs(rawData[barStartSample + s]);
              count++;
            }
          }
          
          const avg = count > 0 ? sum / count : 0;
          const barHeight = Math.max(3, avg * amp * 2.2);
          const x = i * barWidth;
          
          // Draw bar with slight margin
          ctx.beginPath();
          ctx.roundRect(x + 1, amp - (barHeight / 2), barWidth - 2, barHeight, 2);
          ctx.fill();
        }
      }
    }

    // Animation Loop
    function drawLoop() {
      renderMovingWaveform('waveA', playerA, startCueA, playStartTimeA, pausePositionA, estimatedBpmA);
      renderMovingWaveform('waveB', playerB, startCueB, playStartTimeB, pausePositionB, estimatedBpmB);
      requestAnimationFrame(drawLoop);
    }
    requestAnimationFrame(drawLoop);

    // BPM Calculation
    function estimateBPM(buffer) {
      const rate = buffer.sampleRate;
      const data = buffer.getChannelData(0);
      let peaks = [];
      for (let i = 0; i < Math.min(data.length, rate * 10); i += Math.floor(rate / 100)) {
        if (Math.abs(data[i]) > 0.45) peaks.push(i);
      }
      if (peaks.length < 2) return 128;
      let intervals = [];
      for (let i = 1; i < peaks.length; i++) intervals.push(peaks[i] - peaks[i - 1]);
      let bpm = Math.round((rate / (intervals.reduce((a, b) => a + b) / intervals.length)) * 0.6);
      while (bpm < 80) bpm *= 2;
      while (bpm > 160) bpm /= 2;
      return Math.round(bpm);
    }

    // Modal Logic
    function openCueModal(file, isDeckA) {
      pendingFile = file;
      pendingIsDeckA = isDeckA;
      
      const url = URL.createObjectURL(file);
      const tempPlayer = new Tone.Player(url, () => {
        const scrubber = document.getElementById('cueScrubber');
        scrubber.max = Math.floor(tempPlayer.buffer.duration);
        scrubber.value = 0;
        document.getElementById('cueTimeDisplay').innerText = "00:00";
        document.getElementById('cueModal').style.display = 'flex';
      });
    }

    document.getElementById('cueScrubber').addEventListener('input', (e) => {
      const sec = parseInt(e.target.value);
      const mins = Math.floor(sec / 60);
      const secs = sec % 60;
      document.getElementById('cueTimeDisplay').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    });

    document.getElementById('confirmCueBtn').addEventListener('click', () => {
      const startTime = parseFloat(document.getElementById('cueScrubber').value);
      document.getElementById('cueModal').style.display = 'none';

      const isA = pendingIsDeckA;
      const playBtn = document.getElementById(isA ? 'playA' : 'playB');
      const cueBtn = document.getElementById(isA ? 'cueA' : 'cueB');
      const fileLabel = document.getElementById(isA ? 'fileBtnA' : 'fileBtnB');
      
      fileLabel.innerText = pendingFile.name.substring(0, 18) + "...";
      playBtn.disabled = true;
      cueBtn.disabled = true;

      const url = URL.createObjectURL(pendingFile);
      const eq = new Tone.EQ3(0, 0, 0);
      const vol = new Tone.Volume(0);

      const player = new Tone.Player({
        url: url,
        loop: true,
        onload: () => {
          player.chain(eq, vol, isA ? getCrossFade().a : getCrossFade().b);
          const bpm = estimateBPM(player.buffer);
          document.getElementById(isA ? 'bpmA' : 'bpmB').innerText = `${bpm} BPM`;
          
          if (isA) estimatedBpmA = bpm;
          else estimatedBpmB = bpm;

          playBtn.disabled = false;
          cueBtn.disabled = false;
        }
      });

      if (isA) { playerA = player; eqA = eq; volA = vol; startCueA = startTime; pausePositionA = 0; playStartTimeA = 0; }
      else { playerB = player; eqB = eq; volB = vol; startCueB = startTime; pausePositionB = 0; playStartTimeB = 0; }
    });

    // File Input Handlers
    document.getElementById('fileA').addEventListener('change', (e) => { if (e.target.files[0]) openCueModal(e.target.files[0], true); });
    document.getElementById('fileB').addEventListener('change', (e) => { if (e.target.files[0]) openCueModal(e.target.files[0], false); });

    // CUE Button - Resets to Cue Point
    document.getElementById('cueA').addEventListener('click', () => {
      if (!playerA) return;
      if (playerA.state === "started") playerA.stop();
      playStartTimeA = 0;
      pausePositionA = 0;
      document.getElementById('playA').innerHTML = "&#9654;";
    });

    document.getElementById('cueB').addEventListener('click', () => {
      if (!playerB) return;
      if (playerB.state === "started") playerB.stop();
      playStartTimeB = 0;
      pausePositionB = 0;
      document.getElementById('playB').innerHTML = "&#9654;";
    });

    // PLAY/PAUSE Buttons - Retains Current Position
    document.getElementById('playA').addEventListener('click', async () => {
      await Tone.start();
      if (!playerA) return;

      if (playerA.state === "started") { 
        const elapsed = (performance.now() - playStartTimeA) / 1000;
        pausePositionA = (pausePositionA > 0 ? pausePositionA : startCueA) + elapsed;
        playerA.stop(); 
        playStartTimeA = 0;
        document.getElementById('playA').innerHTML = "&#9654;"; 
      } else { 
        playStartTimeA = performance.now();
        const startFrom = pausePositionA > 0 ? pausePositionA : startCueA;
        playerA.start(undefined, startFrom); 
        document.getElementById('playA').innerHTML = "&#10074;&#10074;"; 
      }
    });

    document.getElementById('playB').addEventListener('click', async () => {
      await Tone.start();
      if (!playerB) return;

      if (playerB.state === "started") { 
        const elapsed = (performance.now() - playStartTimeB) / 1000;
        pausePositionB = (pausePositionB > 0 ? pausePositionB : startCueB) + elapsed;
        playerB.stop(); 
        playStartTimeB = 0;
        document.getElementById('playB').innerHTML = "&#9654;"; 
      } else { 
        playStartTimeB = performance.now();
        const startFrom = pausePositionB > 0 ? pausePositionB : startCueB;
        playerB.start(undefined, startFrom); 
        document.getElementById('playB').innerHTML = "&#10074;&#10074;"; 
      }
    });

    // Volume Hotkeys
    window.addEventListener('keydown', (e) => {
      const volSliderA = document.getElementById('volA');
      const volSliderB = document.getElementById('volB');

      if (e.key.toLowerCase() === 'q') {
        volSliderA.value = Math.max(0, parseFloat(volSliderA.value) - 0.05);
        volSliderA.dispatchEvent(new Event('input'));
      }
      if (e.key.toLowerCase() === 'w') {
        volSliderA.value = Math.min(1, parseFloat(volSliderA.value) + 0.05);
        volSliderA.dispatchEvent(new Event('input'));
      }
      if (e.key.toLowerCase() === 'o') {
        volSliderB.value = Math.max(0, parseFloat(volSliderB.value) - 0.05);
        volSliderB.dispatchEvent(new Event('input'));
      }
      if (e.key.toLowerCase() === 'p') {
        volSliderB.value = Math.min(1, parseFloat(volSliderB.value) + 0.05);
        volSliderB.dispatchEvent(new Event('input'));
      }
    });

    // Mixer Listeners
    document.getElementById('volA').addEventListener('input', (e) => { if (volA) volA.volume.value = Tone.gainToDb(parseFloat(e.target.value)); });
    document.getElementById('volB').addEventListener('input', (e) => { if (volB) volB.volume.value = Tone.gainToDb(parseFloat(e.target.value)); });

    document.getElementById('highA').addEventListener('input', (e) => { if (eqA) eqA.high.value = parseFloat(e.target.value); });
    document.getElementById('midA').addEventListener('input', (e) => { if (eqA) eqA.mid.value = parseFloat(e.target.value); });
    document.getElementById('lowA').addEventListener('input', (e) => { if (eqA) eqA.low.value = parseFloat(e.target.value); });

    document.getElementById('highB').addEventListener('input', (e) => { if (eqB) eqB.high.value = parseFloat(e.target.value); });
    document.getElementById('midB').addEventListener('input', (e) => { if (eqB) eqB.mid.value = parseFloat(e.target.value); });
    document.getElementById('lowB').addEventListener('input', (e) => { if (eqB) eqB.low.value = parseFloat(e.target.value); });

    // Crossfader Logic
    const fader = document.getElementById('fader');
    fader.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (crossFade) crossFade.fade.value = val;
      if (val > 0.05 && transitionStart === 0) transitionStart = Date.now();
      if (val >= 0.95 && transitionStart !== 0 && transitionEnd === 0) transitionEnd = Date.now();
    });

    // AI Evaluator
    document.getElementById('submitBtn').addEventListener('click', () => {
      let score = 100;
      let logs = [];

      const faderVal = parseFloat(fader.value);
      const lowAVal = eqA ? eqA.low.value : 0;
      const lowBVal = eqB ? eqB.low.value : 0;

      if (faderVal < 0.9) {
        score -= 35;
        logs.push("❌ Incomplete transition: Crossfader never reached Deck B (-35 pts)");
      } else {
        logs.push("✅ Full crossfader sweep completed.");
      }

      if (transitionStart && transitionEnd) {
        const duration = (transitionEnd - transitionStart) / 1000;
        logs.push(`⏱️ Duration: ${duration.toFixed(2)}s`);
        if (duration < 2.0) { score -= 25; logs.push("⚠️ Transition too fast/abrupt (-25 pts)"); }
        else if (duration > 9.0) { score -= 15; logs.push("⚠️ Transition too slow (-15 pts)"); }
        else { logs.push("⭐ Optimal transition pacing."); }
      } else {
        score -= 40;
        logs.push("❌ Crossfader movement missing (-40 pts)");
      }

      if (lowAVal > -6 && lowBVal > -6 && faderVal > 0.3 && faderVal < 0.7) {
        score -= 20;
        logs.push("⚠️ Low-end clash detected! Both sub-bass EQ knobs were open during the blend (-20 pts)");
      } else {
        logs.push("⭐ Clean EQ separation (no low-end clash).");
      }

      score = Math.max(0, score);
      document.getElementById('scoreBox').style.display = "block";
      document.getElementById('scoreHeader').innerText = `SCORE: ${score} / 100`;
      document.getElementById('scoreLog').innerHTML = logs.map(l => `<p style="margin: 3px 0;">${l}</p>`).join('');
    });
  </script>
</body>
</html>
