<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DJ TRANSITION CLASH</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #121216;
      --panel-bg: #18181f;
      --cyan: #00f2fe;
      --text-main: #ffffff;
      --text-muted: #70707c;
      --border: #262630;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: var(--cyan);
      letter-spacing: 2px;
      font-size: 1.8rem;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    p.subtitle {
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 0.85rem;
    }

    .dj-console {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 820px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .decks {
      display: flex;
      gap: 20px;
    }

    .deck {
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 16px;
      flex: 1;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }

    .deck-title {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .bpm-badge {
      background: #000;
      color: var(--cyan);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: monospace;
      border: 1px solid var(--border);
    }

    /* Waveform Screen */
    .waveform-card {
      width: 100%;
      height: 60px;
      background: #050507;
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 12px;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    .file-input {
      font-size: 0.75rem;
      width: 100%;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    /* Hardware Transport Play Button */
    .play-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #0d0d11;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(0,242,254,0.1);
    }

    .play-btn:hover {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 15px rgba(0,242,254,0.4);
    }

    .play-btn:disabled {
      border-color: var(--border);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Vertical Mixer Strip */
    .mixer-strip {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #0d0d11;
      padding: 15px 5px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .v-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .v-control label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* Range Sliders turned Vertical */
    input[type=range].vertical {
      writing-mode: bt-linear;
      appearance: slider-vertical;
      width: 8px;
      height: 90px;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    /* Crossfader Panel */
    .crossfader-panel {
      margin-top: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }

    .crossfader-panel label {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .crossfader-slider {
      width: 70%;
      height: 6px;
      accent-color: var(--cyan);
      margin-top: 10px;
      cursor: pointer;
    }

    .fader-labels {
      display: flex;
      justify-content: space-between;
      padding: 0 15%;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Action & Scoring */
    .actions {
      margin-top: 20px;
      text-align: center;
    }

    .btn-submit {
      background: var(--cyan);
      color: #000;
      border: none;
      padding: 12px 32px;
      font-weight: 700;
      border-radius: 20px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit:hover { opacity: 0.85; }

    .score-box {
      margin-top: 20px;
      background: #0d0d11;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      display: none;
    }

    .score-header {
      font-size: 1.2rem;
      color: var(--cyan);
      font-weight: bold;
    }

    .score-log {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>DJ TRANSITION CLASH</h1>
  <p class="subtitle">MINIMALIST PRO CONSOLE</p>

  <div class="dj-console">
    <div class="decks">
      
      <!-- DECK A -->
      <div class="deck">
        <div class="deck-header">
          <span class="deck-title">DECK A</span>
          <span id="bpmA" class="bpm-badge">-- BPM</span>
        </div>
        <div class="waveform-card">
          <canvas id="waveA"></canvas>
        </div>
        <input type="file" id="fileA" class="file-input" accept="audio/*">
        <button id="playA" class="play-btn" disabled>&#9654;</button>

        <div class="mixer-strip">
          <div class="v-control">
            <label>VOL</label>
            <input type="range" id="volA" class="vertical" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="v-control">
            <label>HIGH</label>
            <input type="range" id="highA" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
          <div class="v-control">
            <label>MID</label>
            <input type="range" id="midA" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
          <div class="v-control">
            <label>LOW</label>
            <input type="range" id="lowA" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
        </div>
      </div>

      <!-- DECK B -->
      <div class="deck">
        <div class="deck-header">
          <span class="deck-title">DECK B</span>
          <span id="bpmB" class="bpm-badge">-- BPM</span>
        </div>
        <div class="waveform-card">
          <canvas id="waveB"></canvas>
        </div>
        <input type="file" id="fileB" class="file-input" accept="audio/*">
        <button id="playB" class="play-btn" disabled>&#9654;</button>

        <div class="mixer-strip">
          <div class="v-control">
            <label>VOL</label>
            <input type="range" id="volB" class="vertical" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="v-control">
            <label>HIGH</label>
            <input type="range" id="highB" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
          <div class="v-control">
            <label>MID</label>
            <input type="range" id="midB" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
          <div class="v-control">
            <label>LOW</label>
            <input type="range" id="lowB" class="vertical" min="-24" max="6" step="1" value="0">
          </div>
        </div>
      </div>

    </div>

    <!-- CROSSFADER -->
    <div class="crossfader-panel">
      <label>CROSSFADER</label><br>
      <input type="range" id="fader" class="crossfader-slider" min="0" max="1" step="0.01" value="0">
      <div class="fader-labels">
        <span>DECK A</span>
        <span>MIX</span>
        <span>DECK B</span>
      </div>
    </div>

    <div class="actions">
      <button id="submitBtn" class="btn-submit">EVALUATE TRANSITION</button>
    </div>

    <div id="scoreBox" class="score-box">
      <div id="scoreHeader" class="score-header">SCORE: 0 / 100</div>
      <div id="scoreLog" class="score-log"></div>
    </div>
  </div>

  <script>
    let playerA, playerB, eqA, eqB, volA, volB, crossFade;
    let transitionStart = 0, transitionEnd = 0;

    function getCrossFade() {
      if (!crossFade) crossFade = new Tone.CrossFade(0).toDestination();
      return crossFade;
    }

    // Waveform Renderer Engine
    function drawWaveform(canvasId, buffer) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const width = canvas.width = canvas.offsetWidth;
      const height = canvas.height = canvas.offsetHeight;
      
      const data = buffer.getChannelData(0);
      const step = Math.ceil(data.length / width);
      const amp = height / 2;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#00f2fe";

      for (let i = 0; i < width; i++) {
        let min = 1.0, max = -1.0;
        for (let j = 0; j < step; j++) {
          const datum = data[(i * step) + j];
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
        ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
      }
    }

    // BPM Calculation
    function estimateBPM(buffer) {
      const rate = buffer.sampleRate;
      const data = buffer.getChannelData(0);
      let peaks = [];
      for (let i = 0; i < Math.min(data.length, rate * 10); i += Math.floor(rate / 100)) {
        if (Math.abs(data[i]) > 0.45) peaks.push(i);
      }
      if (peaks.length < 2) return 124;
      let intervals = [];
      for (let i = 1; i < peaks.length; i++) intervals.push(peaks[i] - peaks[i - 1]);
      let bpm = Math.round((rate / (intervals.reduce((a, b) => a + b) / intervals.length)) * 0.6);
      while (bpm < 80) bpm *= 2;
      while (bpm > 160) bpm /= 2;
      return Math.round(bpm);
    }

    // Setup Audio Chains
    function loadDeck(file, isDeckA) {
      const btn = document.getElementById(isDeckA ? 'playA' : 'playB');
      btn.disabled = true;

      const url = URL.createObjectURL(file);
      const eq = new Tone.EQ3(0, 0, 0);
      const vol = new Tone.Volume(0);

      const player = new Tone.Player({
        url: url,
        loop: true,
        onload: () => {
          player.chain(eq, vol, isDeckA ? getCrossFade().a : getCrossFade().b);
          drawWaveform(isDeckA ? 'waveA' : 'waveB', player.buffer);
          document.getElementById(isDeckA ? 'bpmA' : 'bpmB').innerText = `${estimateBPM(player.buffer)} BPM`;
          btn.disabled = false;
        }
      });

      if (isDeckA) { playerA = player; eqA = eq; volA = vol; }
      else { playerB = player; eqB = eq; volB = vol; }
    }

    // File Upload Listeners
    document.getElementById('fileA').addEventListener('change', (e) => { if (e.target.files[0]) loadDeck(e.target.files[0], true); });
    document.getElementById('fileB').addEventListener('change', (e) => { if (e.target.files[0]) loadDeck(e.target.files[0], false); });

    // Transport Buttons
    document.getElementById('playA').addEventListener('click', async () => {
      await Tone.start();
      if (playerA.state === "started") { playerA.stop(); document.getElementById('playA').innerHTML = "&#9654;"; }
      else { playerA.start(); document.getElementById('playA').innerHTML = "&#10074;&#10074;"; }
    });

    document.getElementById('playB').addEventListener('click', async () => {
      await Tone.start();
      if (playerB.state === "started") { playerB.stop(); document.getElementById('playB').innerHTML = "&#9654;"; }
      else { playerB.start(); document.getElementById('playB').innerHTML = "&#10074;&#10074;"; }
    });

    // Mixer Hardware Listeners
    document.getElementById('volA').addEventListener('input', (e) => { if (volA) volA.volume.value = Tone.gainToDb(parseFloat(e.target.value)); });
    document.getElementById('volB').addEventListener('input', (e) => { if (volB) volB.volume.value = Tone.gainToDb(parseFloat(e.target.value)); });

    document.getElementById('highA').addEventListener('input', (e) => { if (eqA) eqA.high.value = parseFloat(e.target.value); });
    document.getElementById('midA').addEventListener('input', (e) => { if (eqA) eqA.mid.value = parseFloat(e.target.value); });
    document.getElementById('lowA').addEventListener('input', (e) => { if (eqA) eqA.low.value = parseFloat(e.target.value); });

    document.getElementById('highB').addEventListener('input', (e) => { if (eqB) eqB.high.value = parseFloat(e.target.value); });
    document.getElementById('midB').addEventListener('input', (e) => { if (eqB) eqB.mid.value = parseFloat(e.target.value); });
    document.getElementById('lowB').addEventListener('input', (e) => { if (eqB) eqB.low.value = parseFloat(e.target.value); });

    // Crossfader Tracking
    const fader = document.getElementById('fader');
    fader.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (crossFade) crossFade.fade.value = val;
      if (val > 0.05 && transitionStart === 0) transitionStart = Date.now();
      if (val >= 0.95 && transitionStart !== 0 && transitionEnd === 0) transitionEnd = Date.now();
    });

    // Multi-Metric AI Transition Evaluator
    document.getElementById('submitBtn').addEventListener('click', () => {
      let score = 100;
      let logs = [];

      const faderVal = parseFloat(fader.value);
      const lowAVal = eqA ? eqA.low.value : 0;
      const lowBVal = eqB ? eqB.low.value : 0;

      // 1. Crossfader Execution
      if (faderVal < 0.9) {
        score -= 35;
        logs.push("❌ Incomplete transition: Crossfader never reached Deck B (-35 pts)");
      } else {
        logs.push("✅ Full crossfader sweep completed.");
      }

      // 2. Duration Quality
      if (transitionStart && transitionEnd) {
        const duration = (transitionEnd - transitionStart) / 1000;
        logs.push(`⏱️ Duration: ${duration.toFixed(2)}s`);
        if (duration < 2.0) { score -= 25; logs.push("⚠️ Transition too fast/abrupt (-25 pts)"); }
        else if (duration > 9.0) { score -= 15; logs.push("⚠️ Transition too slow (-15 pts)"); }
        else { logs.push("⭐ Optimal transition pacing."); }
      } else {
        score -= 40;
        logs.push("❌ Crossfader movement missing (-40 pts)");
      }

      // 3. Frequency / Bass Clash Engine
      if (lowAVal > -6 && lowBVal > -6 && faderVal > 0.3 && faderVal < 0.7) {
        score -= 20;
        logs.push("⚠️ Low-end clash detected! Both sub-bass EQ knobs were open during the blend (-20 pts)");
      } else {
        logs.push("⭐ Clean EQ separation (no low-end clash).");
      }

      score = Math.max(0, score);
      document.getElementById('scoreBox').style.display = "block";
      document.getElementById('scoreHeader').innerText = `SCORE: ${score} / 100`;
      document.getElementById('scoreLog').innerHTML = logs.map(l => `<p style="margin: 3px 0;">${l}</p>`).join('');
    });
  </script>
</body>
</html>
