<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DJ TRANSITION CLASH - PRO CONSOLE</title>
  <!-- Tone.js for Audio Routing & EQ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Wavesurfer.js for Visual Rendering -->
  <script src="https://unpkg.com/wavesurfer.js@7"></script>

  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #121216;
      --panel-bg: #18181f;
      --cyan: #00f2fe;
      --text-main: #ffffff;
      --text-muted: #70707c;
      --border: #262630;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: var(--cyan);
      letter-spacing: 2px;
      font-size: 1.8rem;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    p.subtitle {
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 0.85rem;
    }

    .dj-console {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 880px;
      max-width: 95vw;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .decks {
      display: flex;
      gap: 20px;
      width: 100%;
    }

    .deck {
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 16px;
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }

    .deck-title {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .bpm-badge {
      background: #000;
      color: var(--cyan);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: monospace;
      border: 1px solid var(--border);
    }

    .waveform-card {
      width: 100%;
      height: 100px;
      background: #050507;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden !important;
    }

    .waveform-target {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .playhead-center {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 8px var(--cyan);
      z-index: 100;
      pointer-events: none;
    }

    .track-info-badge {
      background: #121216;
      border: 1px solid var(--border);
      color: var(--cyan);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
      margin-bottom: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transport-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 15px;
    }

    .cue-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0d0d11;
      border: 2px solid #ff007f;
      color: #ff007f;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0d0d11;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mixer-strip {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #0d0d11;
      padding: 15px 5px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .v-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .v-control label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      font-weight: 600;
    }

    input[type=range].vertical {
      writing-mode: bt-linear;
      appearance: slider-vertical;
      width: 8px;
      height: 90px;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .crossfader-panel {
      margin-top: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }

    .crossfader-slider {
      width: 70%;
      height: 6px;
      accent-color: var(--cyan);
      margin-top: 10px;
      cursor: pointer;
    }

    .fader-labels {
      display: flex;
      justify-content: space-between;
      padding: 0 15%;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .actions { margin-top: 20px; text-align: center; }

    .btn-submit {
      background: var(--cyan);
      color: #000;
      border: none;
      padding: 12px 32px;
      font-weight: 700;
      border-radius: 20px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .score-box {
      margin-top: 20px;
      background: #0d0d11;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      display: none;
    }

    .score-header { font-size: 1.2rem; color: var(--cyan); font-weight: bold; }
    .score-log { color: var(--text-muted); font-size: 0.8rem; margin-top: 8px; }
  </style>
</head>
<body>

  <h1>DJ TRANSITION CLASH</h1>
  <p class="subtitle">PRO AUDIO PIPELINE • INTEGRATED TEST TRACKS</p>

  <div class="dj-console">
    <div class="decks">
      
      <!-- DECK A -->
      <div class="deck">
        <div class="deck-header">
          <span class="deck-title">DECK A</span>
          <span id="bpmA" class="bpm-badge">128 BPM</span>
        </div>
        <div class="waveform-card">
          <div class="playhead-center"></div>
          <div id="waveA" class="waveform-target"></div>
        </div>
        
        <div class="track-info-badge">TEST TRACK A (trackA.mp3)</div>
        
        <div class="transport-bar">
          <button id="cueA" class="cue-btn">CUE</button>
          <button id="playA" class="play-btn">&#9654;</button>
        </div>

        <div class="mixer-strip">
          <div class="v-control">
            <label>VOL [Q/W]</label>
            <input type="range" id="volA" class="vertical" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="v-control"><label>HIGH</label><input type="range" id="highA" class="vertical" min="-24" max="6" step="1" value="0"></div>
          <div class="v-control"><label>MID</label><input type="range" id="midA" class="vertical" min="-24" max="6" step="1" value="0"></div>
          <div class="v-control"><label>LOW</label><input type="range" id="lowA" class="vertical" min="-24" max="6" step="1" value="0"></div>
        </div>
      </div>

      <!-- DECK B -->
      <div class="deck">
        <div class="deck-header">
          <span class="deck-title">DECK B</span>
          <span id="bpmB" class="bpm-badge">128 BPM</span>
        </div>
        <div class="waveform-card">
          <div class="playhead-center"></div>
          <div id="waveB" class="waveform-target"></div>
        </div>

        <div class="track-info-badge">TEST TRACK B (trackB.mp3)</div>

        <div class="transport-bar">
          <button id="cueB" class="cue-btn">CUE</button>
          <button id="playB" class="play-btn">&#9654;</button>
        </div>

        <div class="mixer-strip">
          <div class="v-control">
            <label>VOL [O/P]</label>
            <input type="range" id="volB" class="vertical" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="v-control"><label>HIGH</label><input type="range" id="highB" class="vertical" min="-24" max="6" step="1" value="0"></div>
          <div class="v-control"><label>MID</label><input type="range" id="midB" class="vertical" min="-24" max="6" step="1" value="0"></div>
          <div class="v-control"><label>LOW</label><input type="range" id="lowB" class="vertical" min="-24" max="6" step="1" value="0"></div>
        </div>
      </div>

    </div>

    <!-- CROSSFADER -->
    <div class="crossfader-panel">
      <label>CROSSFADER</label><br>
      <input type="range" id="fader" class="crossfader-slider" min="0" max="1" step="0.01" value="0">
      <div class="fader-labels"><span>DECK A</span><span>MIX</span><span>DECK B</span></div>
    </div>

    <div class="actions">
      <button id="submitBtn" class="btn-submit">EVALUATE TRANSITION</button>
    </div>

    <div id="scoreBox" class="score-box">
      <div id="scoreHeader" class="score-header">SCORE: 0 / 100</div>
      <div id="scoreLog" class="score-log"></div>
    </div>
  </div>

  <script>
    // DEFINE YOUR TEST TRACK FILENAMES HERE:
    const TEST_TRACK_A = "trackA.mp3";
    const TEST_TRACK_B = "trackB.mp3";

    let wsA, wsB;
    let eqA, eqB, volA, volB, crossFade;
    let transitionStart = 0, transitionEnd = 0;

    // Tone.js Audio Node Setup
    function setupToneNodes() {
      crossFade = new Tone.CrossFade(0).toDestination();

      eqA = new Tone.EQ3(0, 0, 0);
      volA = new Tone.Volume(0);
      eqA.chain(volA, crossFade.a);

      eqB = new Tone.EQ3(0, 0, 0);
      volB = new Tone.Volume(0);
      eqB.chain(volB, crossFade.b);
    }

    // Initialize Wavesurfer and Route Audio Output into Tone.js EQ Engine
    function initDecks() {
      setupToneNodes();

      const config = {
        waveColor: '#1e1e28',
        progressColor: '#00f2fe',
        cursorColor: 'transparent',
        barWidth: 3,
        barGap: 2,
        barRadius: 2,
        height: 100,
        minPxPerSec: 80,
        autoScroll: true,
        autoCenter: true,
        hideScrollbar: true
      };

      // DECK A
      wsA = WaveSurfer.create({ ...config, container: '#waveA', url: TEST_TRACK_A });
      wsA.on('ready', () => {
        // Connect Wavesurfer Web Audio element directly to Tone.js EQ Node
        const mediaNode = Tone.getContext().rawContext.createMediaElementSource(wsA.getMediaElement());
        Tone.connect(mediaNode, eqA);
      });

      // DECK B
      wsB = WaveSurfer.create({ ...config, container: '#waveB', url: TEST_TRACK_B });
      wsB.on('ready', () => {
        const mediaNode = Tone.getContext().rawContext.createMediaElementSource(wsB.getMediaElement());
        Tone.connect(mediaNode, eqB);
      });
    }

    window.addEventListener('DOMContentLoaded', initDecks);

    // Transport Controls
    document.getElementById('cueA').addEventListener('click', () => { wsA.pause(); wsA.setTime(0); document.getElementById('playA').innerHTML = "&#9654;"; });
    document.getElementById('cueB').addEventListener('click', () => { wsB.pause(); wsB.setTime(0); document.getElementById('playB').innerHTML = "&#9654;"; });

    document.getElementById('playA').addEventListener('click', async () => {
      await Tone.start();
      if (wsA.isPlaying()) { wsA.pause(); document.getElementById('playA').innerHTML = "&#9654;"; }
      else { wsA.play(); document.getElementById('playA').innerHTML = "&#10074;&#10074;"; }
    });

    document.getElementById('playB').addEventListener('click', async () => {
      await Tone.start();
      if (wsB.isPlaying()) { wsB.pause(); document.getElementById('playB').innerHTML = "&#9654;"; }
      else { wsB.play(); document.getElementById('playB').innerHTML = "&#10074;&#10074;"; }
    });

    // Mixer Listeners (Connected Directly to Tone.js DSP Engine)
    document.getElementById('volA').addEventListener('input', (e) => { if (volA) volA.volume.value = Tone.gainToDb(parseFloat(e.target.value)); });
    document.getElementById('volB').addEventListener('input', (e) => { if (volB) volB.volume.value = Tone.gainToDb(parseFloat(e.target.value)); });

    document.getElementById('highA').addEventListener('input', (e) => { if (eqA) eqA.high.value = parseFloat(e.target.value); });
    document.getElementById('midA').addEventListener('input', (e) => { if (eqA) eqA.mid.value = parseFloat(e.target.value); });
    document.getElementById('lowA').addEventListener('input', (e) => { if (eqA) eqA.low.value = parseFloat(e.target.value); });

    document.getElementById('highB').addEventListener('input', (e) => { if (eqB) eqB.high.value = parseFloat(e.target.value); });
    document.getElementById('midB').addEventListener('input', (e) => { if (eqB) eqB.mid.value = parseFloat(e.target.value); });
    document.getElementById('lowB').addEventListener('input', (e) => { if (eqB) eqB.low.value = parseFloat(e.target.value); });

    // Hotkeys
    window.addEventListener('keydown', (e) => {
      const volSliderA = document.getElementById('volA');
      const volSliderB = document.getElementById('volB');
      if (e.key.toLowerCase() === 'q') { volSliderA.value = Math.max(0, parseFloat(volSliderA.value) - 0.05); volSliderA.dispatchEvent(new Event('input')); }
      if (e.key.toLowerCase() === 'w') { volSliderA.value = Math.min(1, parseFloat(volSliderA.value) + 0.05); volSliderA.dispatchEvent(new Event('input')); }
      if (e.key.toLowerCase() === 'o') { volSliderB.value = Math.max(0, parseFloat(volSliderB.value) - 0.05); volSliderB.dispatchEvent(new Event('input')); }
      if (e.key.toLowerCase() === 'p') { volSliderB.value = Math.min(1, parseFloat(volSliderB.value) + 0.05); volSliderB.dispatchEvent(new Event('input')); }
    });

    // Crossfader Logic
    const fader = document.getElementById('fader');
    fader.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (crossFade) crossFade.fade.value = val;
      if (val > 0.05 && transitionStart === 0) transitionStart = Date.now();
      if (val >= 0.95 && transitionStart !== 0 && transitionEnd === 0) transitionEnd = Date.now();
    });

    // AI Evaluator
    document.getElementById('submitBtn').addEventListener('click', () => {
      let score = 100;
      let logs = [];
      const faderVal = parseFloat(fader.value);
      const lowAVal = eqA ? eqA.low.value : 0;
      const lowBVal = eqB ? eqB.low.value : 0;

      if (faderVal < 0.9) { score -= 35; logs.push("❌ Incomplete transition: Crossfader never reached Deck B (-35 pts)"); }
      else { logs.push("✅ Full crossfader sweep completed."); }

      if (transitionStart && transitionEnd) {
        const duration = (transitionEnd - transitionStart) / 1000;
        logs.push(`⏱️ Duration: ${duration.toFixed(2)}s`);
        if (duration < 2.0) { score -= 25; logs.push("⚠️ Transition too fast/abrupt (-25 pts)"); }
        else if (duration > 9.0) { score -= 15; logs.push("⚠️ Transition too slow (-15 pts)"); }
        else { logs.push("⭐ Optimal transition pacing."); }
      } else { score -= 40; logs.push("❌ Crossfader movement missing (-40 pts)"); }

      if (lowAVal > -6 && lowBVal > -6 && faderVal > 0.3 && faderVal < 0.7) {
        score -= 20; logs.push("⚠️ Low-end clash detected! Both sub-bass EQ knobs were open during the blend (-20 pts)");
      } else { logs.push("⭐ Clean EQ separation (no low-end clash)."); }

      score = Math.max(0, score);
      document.getElementById('scoreBox').style.display = "block";
      document.getElementById('scoreHeader').innerText = `SCORE: ${score} / 100`;
      document.getElementById('scoreLog').innerHTML = logs.map(l => `<p style="margin: 3px 0;">${l}</p>`).join('');
    });
  </script>
</body>
</html>
